[package]
name = "ultrasound"
version = "1.0.0"
edition = "2024"
description = "A faster, fixed drop-in replacement for the Black Ops III Mod Tools' snd_convert"
license = "MIT"
repository = "https://github.com/Blakintosh/ultrasound"

[features]
flac_hifi = []

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
csv = "1.4.0"
json5 = "1.3.1"
md-5 = "0.11.0"
rayon = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28.0", features = ["derive"] }
lewton = "0.10"
sha2 = "0.11"

[dev-dependencies]
vorbis_rs = "0.5"

[build-dependencies]
embed-resource = "3.0.12"
